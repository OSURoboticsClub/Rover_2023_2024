controller_server:
  ros__parameters:
    use_sim_time: False
    odom_topic: "odom"
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.0  # Rover cannot strafe
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
      
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.75
      yaw_goal_tolerance: 0.4
      stateful: True
      
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      
      # Speed limits
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 0.2 #rads/s
      min_speed_xy: 0.0
      max_speed_xy: 0.8
      min_speed_theta: 0.0
      # Acceleration
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 0.15
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -0.15
      # Trajectory
      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 25
      sim_time: 1.8
      linear_granularity: 0.1
      angular_granularity: 0.05
      transform_tolerance: 0.25
      xy_goal_tolerance: 0.75
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 16.0
      PathAlign.forward_point_distance: 0.2
      GoalAlign.scale: 12.0
      GoalAlign.forward_point_distance: 0.2
      PathDist.scale: 16.0
      GoalDist.scale: 12.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: rover_base_origin
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.55
      always_send_full_costmap: True
      rolling_window: True
      
      # Layers
      plugins: ["voxel_layer", "inflation_layer"]
      
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False # True = Debug
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        footprint_clearing_enabled: True
        max_obstacle_height: 2.0
        mark_threshold: 0
        #combination_method: 1

        observation_sources: ground obstacles
        ground:
          topic: /camera/ground
          max_obstacle_height: 0.4
          clearing: True
          marking: False
          data_type: "PointCloud2"
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.2
          raytrace_min_range: 0.0

        obstacles:
          topic: /camera/obstacles
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.2
          raytrace_min_range: 0.0

        # static_layer:
        #   plugin: "nav2_costmap_2d::StaticLayer"
        #   map_subscribe_transient_local: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: rover_base_origin
      robot_radius: 0.55
      resolution: 0.1
      track_unknown_space: False
      always_send_full_costmap: False
      
      rolling_window: True
      width: 50
      height: 50
      # origin_x: -25.0 # center on rover
      # origin_y: -25.0

      #Layers
      # plugins: ["static_layer", "inflation_layer"]
      plugins: ["voxel_layer", "inflation_layer"]
      
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False # True = Debug
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        footprint_clearing_enabled: True
        max_obstacle_height: 2.0
        mark_threshold: 0
        #combination_method: 1

        observation_sources: ground obstacles
        ground:
          topic: /camera/ground
          max_obstacle_height: 0.4
          clearing: True
          marking: False
          data_type: "PointCloud2"
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.2
          raytrace_min_range: 0.0

        obstacles:
          topic: /camera/obstacles
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.2
          raytrace_min_range: 0.0

      # static_layer:
      #   plugin: "nav2_costmap_2d::StaticLayer"
      #   footprint_clearing_enabled: True
      #   subscribe_to_updates: True
      #   map_topic: /map
      #   map_subscribe_transient_local: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      
