controller_server:
  ros__parameters:
    use_sim_time: False
    odom_topic: /odometry/local
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.0  # Rover cannot strafe
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0
      
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 0.4
      stateful: True
      
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      xy_goal_tolerance: 0.5

      # Speed limits
      min_vel_x: 0.0
      max_vel_x: 0.5
      min_vel_y: 0.0
      max_vel_y: 0.0
      min_vel_theta: -1.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.8
      min_speed_theta: 0.5

      # Acceleration
      decel_lim_x: -0.5
      acc_lim_x: 0.5
      decel_lim_y: 0.0
      acc_lim_y: 0.0
      decel_lim_theta: -1.0
      acc_lim_theta: 1.5

      # Trajectory
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 60
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.01
      transform_tolerance: 0.25
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: True
      stateful: True

      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]

      PathAlign.scale: 10.0
      PathAlign.forward_point_distance: 0.05
      GoalAlign.scale: 10.0
      GoalAlign.forward_point_distance: 0.05

      RotateToGoal.scale: 25.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      BaseObstacle.scale: 0.02

      Oscillation.scale: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: rover_base_origin
      resolution: 0.05 # match rtab voxel_size
      robot_radius: 0.7
      always_send_full_costmap: True
      
      rolling_window: True
      width: 5
      height: 5

      # Layers
      plugins: ["obstacle_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        min_obstacle_height: -1.5
        max_obstacle_height: 2.0 # rover height, we can roll under things above this height (discard points above)
        # combination_method: 1

        observation_sources: ground obstacles
        ground:
          topic: /camera/ground
          clearing: True
          marking: False
          data_type: "PointCloud2"
          transport_type: "raw"
          min_obstacle_height: -1.5
          max_obstacle_height: 0.5
          obstacle_min_range: 0.0
          obstacle_max_range: 3.5
          raytrace_min_range: 0.0
          raytrace_max_range: 6.0
          inf_is_valid: False

        obstacles:
          topic: /camera/obstacles
          clearing: True
          marking: True
          data_type: "PointCloud2"
          transport_type: "raw"
          min_obstacle_height: -1.5
          max_obstacle_height: 2.0 # rover height, we can roll under things above this height (discard points above)
          obstacle_min_range: 0.0
          obstacle_max_range: 3.5
          raytrace_min_range: 0.0
          raytrace_max_range: 6.0
          inf_is_valid: False

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 5.0
        inflation_radius: 0.5


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom # map
      robot_base_frame: rover_base_origin
      robot_radius: 0.7
      resolution: 0.1
      track_unknown_space: False
      always_send_full_costmap: True
      
      rolling_window: True
      width: 50
      height: 50
      # origin_x: -25.0 # center on rover
      # origin_y: -25.0

      #Layers
      plugins: ["obstacle_layer", "inflation_layer", "gradient_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        min_obstacle_height: -1.5
        max_obstacle_height: 2.0
        # combination_method: 1

        observation_sources: obstacles
        # observation_sources: ground obstacles
        # ground:
        #   topic: /camera/ground
        #   clearing: True
        #   marking: False
        #   data_type: "PointCloud2"
        #   transport_type: "raw"
        #   min_obstacle_height: -1.5
        #   max_obstacle_height: 0.5
        #   obstacle_min_range: 0.0
        #   obstacle_max_range: 5.0
        #   raytrace_min_range: 0.0
        #   raytrace_max_range: 6.0
        #   inf_is_valid: False

        obstacles:
          topic: /camera/obstacles
          clearing: True
          marking: True
          data_type: "PointCloud2"
          transport_type: "raw"
          min_obstacle_height: -1.5
          max_obstacle_height: 2.0
          obstacle_min_range: 0.0
          obstacle_max_range: 5.0
          raytrace_min_range: 0.0
          raytrace_max_range: 6.0
          inf_is_valid: False

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 3.0
        inflation_radius: 0.5

      gradient_layer:
        plugin: "gradient_cost_plugin::GradientCostLayer"
        enabled: True
        max_step: 0.3
        min_angle: 10
        max_angle: 40
        topic: /camera/ground
        obstacle_max_range: 5.0
        obstacle_min_range: 0.2
        elevation_combination: "last"
      
