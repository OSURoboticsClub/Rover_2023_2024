controller_server:
  ros__parameters:
    use_sim_time: True
    odom_topic: "drive_controller/odom"
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.0  # Rover cannot strafe
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
      
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.75
      yaw_goal_tolerance: 6.28
      stateful: True
      
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      
      # Speed limits
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 1.0 #rads/s
      min_speed_xy: 0.0
      max_speed_xy: 0.8
      min_speed_theta: 0.0
      # Acceleration
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 0.4
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -0.4
      # Trajectory
      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 25
      sim_time: 1.8
      linear_granularity: 0.1
      angular_granularity: 0.05
      transform_tolerance: 0.25
      xy_goal_tolerance: 0.75
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 16.0
      PathAlign.forward_point_distance: 0.2
      GoalAlign.scale: 12.0
      GoalAlign.forward_point_distance: 0.2
      PathDist.scale: 16.0
      GoalDist.scale: 12.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0


velocity_smoother:
  ros__parameters:
    smoothing_frequency: 30.0
    scale_velocities: false
    use_sim_time: true
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 2.5]
    min_velocity: [-0.5, 0.0, -2.5]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "drive_controller/odom"
    odom_duration: 0.3
    use_realtime_priority: false
    enable_stamped_cmd_vel: true
    # stamp_smoothed_velocity_with_smoothing_time: false  # ONLY IN JAZZY

planner_server:
  ros__parameters:
    use_sim_time: true
    robot_base_frame: rover_base_origin
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

bt_navigator:
  ros__parameters:
    use_sim_time: true
    robot_base_frame: rover_base_origin
    odom_topic: "odometry/local"


