global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      use_sim_time: true
      global_frame: map
      robot_base_frame: rover_base_origin
      robot_radius: 0.42
      resolution: 0.1
      height: 100
      width: 100
      track_unknown_space: false
      rolling_window: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        obstacle_range: 4.0
        raytrace_range: 5.0
        observation_sources: pointcloud
        pointcloud:
          topic: /camera/d455/depth/color/points
          max_obstacle_height: 1.5
          sensor_frame: d455_depth_frame
          clearing: True
          marking: True
          data_type: "PointCloud2"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.0
      always_send_full_costmap: True


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 2.0
      use_sim_time: true
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: rover_base_origin
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      robot_radius: 0.42
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 16
        max_obstacle_height: 1.5
        min_obstacle_height: 0.5
        mark_threshold: 0
        observation_sources: pointcloud
        pointcloud:
          topic: /camera/d455/depth/color/points
          max_obstacle_height: 1.5
          sensor_frame: d455_depth_frame
          clearing: True
          marking: True
          data_type: "PointCloud2"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.55
      always_send_full_costmap: True



